name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test
      - name: Data validator and merge check (B30)
        run: |
          node tools/validate-data.js
          node tools/merge-shards.js --dry
          # conferences.js must be exactly what the merge produces (no unmerged shard, no edit the merge would undo)
          node tools/merge-shards.js > /dev/null && git diff --exit-code --stat data/conferences.js
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: hoggy_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run test:pg
        env: { HOGGY_TEST_DATABASE_URL: 'postgres://postgres:postgres@127.0.0.1:5432/hoggy_test' }
